<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Profile Onboarding — CareerCraft AI</title>
    <meta name="description" content="Complete your 7-step confirmed career profile onboarding." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="auth-loading-gate" class="auth-gate" role="status" aria-live="polite">
      <div class="auth-gate-card">
        <div class="auth-gate-spinner" aria-hidden="true"></div>
        <h1 class="card-title">Verifying your session</h1>
        <p class="card-text">Loading your Career Profile onboarding progress...</p>
      </div>
    </div>

    <div id="protected-app-shell" class="workspace-layout" hidden>
      <aside class="workspace-sidebar" aria-label="Workspace navigation"></aside>

      <div class="workspace-main-col">
        <header class="workspace-topbar">
          <h1 class="workspace-page-title">Career Profile Onboarding</h1>
          <div class="workspace-user-bar">
            <span id="header-user-name">Account</span>
            <button type="button" class="btn btn-secondary btn-sm" data-logout-btn>Logout</button>
          </div>
        </header>

        <main id="main-content" class="workspace-content">
          <div class="card" style="margin-bottom: var(--space-5);">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-3);">
              <div>
                <p id="onboarding-step-kicker" class="section-kicker" style="margin-bottom: 0.25rem;">Step 1 of 7</p>
                <h2 id="onboarding-step-heading" class="section-title" style="font-size: var(--text-2xl);">Personal Details</h2>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: var(--space-2);">
                <a href="/cv-upload.html" class="btn btn-secondary btn-sm">Import from Existing CV</a>
                <button id="skip-onboarding-btn" type="button" class="btn btn-secondary btn-sm">Skip for Now</button>
              </div>
            </div>
          </div>

          <div id="onboarding-stepper" class="stepper-list" role="tablist" aria-label="Onboarding steps"></div>

          <div id="onboarding-alert" class="alert" role="alert" hidden style="margin-bottom: var(--space-5);"></div>

          <div id="onboarding-step-container" class="card"></div>
        </main>
      </div>
    </div>

    <script type="module" src="/js/onboarding.js"></script>
  </body>
</html>
